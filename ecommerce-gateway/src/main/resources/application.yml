server:
  port: 8080

spring:
  application:
    name: ecommerce-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        import-check:
          enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: lb://ecommerce-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=2
        - id: product-service
          uri: lb://ecommerce-product
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=2
        - id: user-service
          uri: lb://ecommerce-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=2
        - id: order-service
          uri: lb://ecommerce-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=2
        - id: cart-service
          uri: lb://ecommerce-order
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=2
        - id: inventory-service
          uri: lb://ecommerce-inventory
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ecommerce-platform-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000

logging:
  level:
    com.ecommerce.gateway: debug
