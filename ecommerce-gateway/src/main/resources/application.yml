server:
  port: 8080

spring:
  application:
    name: ecommerce-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        ip: 127.0.0.1
        enabled: true
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        import-check:
          enabled: false
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        - id: cart-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1
        - id: inventory-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1
        - id: marketing-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/marketing/**
          filters:
            - StripPrefix=1
        - id: aftersales-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/aftersales/**
          filters:
            - StripPrefix=1
        - id: file-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/file/**
          filters:
            - StripPrefix=1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ecommerce-platform-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000

logging:
  level:
    com.ecommerce.gateway: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: /api/auth/v3/api-docs
      - name: Product Service
        url: /api/product/v3/api-docs
      - name: User Service
        url: /api/user/v3/api-docs
      - name: Order Service
        url: /api/order/v3/api-docs
      - name: Inventory Service
        url: /api/inventory/v3/api-docs
      - name: Marketing Service
        url: /api/marketing/v3/api-docs
      - name: Aftersales Service
        url: /api/aftersales/v3/api-docs
      - name: File Service
        url: /api/file/v3/api-docs
