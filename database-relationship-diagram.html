<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商平台数据库关系图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .legend-color {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .legend-line {
            width: 30px;
            height: 3px;
        }
        
        .diagram-container {
            padding: 30px;
            overflow: auto;
            max-height: calc(100vh - 300px);
            position: relative;
        }
        
        #graph-container {
            width: 100%;
            overflow: auto;
        }
        
        #graph-container svg {
            max-width: 100%;
            height: auto;
        }
        
        .controls {
            padding: 15px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">

            <p>共 6 个数据库，39 张表</p>
        </div>
        
        <div class="legend">
            <div class="legend-item">

                <span>ecommerce_product (商品库)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #e1bee7;"></div>
                <span>ecommerce_user (用户库)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #ffe0b2;"></div>
                <span>ecommerce_order (订单库)</span>
            </div>
            <div class="legend-item">

                <span>ecommerce_inventory (库存库)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #f8bbd0;"></div>
                <span>ecommerce_marketing (营销库)</span>

            <div class="legend-item">
                <div class="legend-color" style="background: #e0e0e0;"></div>
                <span>ecommerce_file (文件库)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: #666;"></div>
                <span>库内关系</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: #ff5722; border-top: 2px dashed #ff5722; height: 0;"></div>
                <span>跨库关系</span>
            </div>
        </div>

    <script>
        let currentScale = 1;

        function zoomIn() {
            currentScale += 0.2;
            applyZoom();
        }

        function zoomOut() {
            if (currentScale > 0.4) {
                currentScale -= 0.2;
                applyZoom();
            }
        }

        function resetZoom() {
            currentScale = 1;
            applyZoom();
        }

        function applyZoom() {
            const svgElement = document.querySelector('#graph-container svg');
            if (svgElement) {
                svgElement.style.transform = `scale(${currentScale})`;
                svgElement.style.transformOrigin = 'top left';
                svgElement.style.transition = 'transform 0.3s ease';
            }
        }
    </script>
